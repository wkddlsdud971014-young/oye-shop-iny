<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 오예상점</title>
<meta name="description" content="이메일과 비밀번호로 가입하고 로그인합니다">
<link rel="stylesheet" href="assets/style.css">

<!-- 동의 기본값 — 태그 관리자보다 먼저 둡니다 -->
<script>
// 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
window.dataLayer = window.dataLayer || [];
// 동의 신호를 통로에 넣는 창구
function gtag(){dataLayer.push(arguments);}
// 네 신호의 기본값 — 아직 아무것도 고르지 않은 손님은 전부 denied
gtag('consent','default',{
  'ad_storage':'denied',
  'analytics_storage':'denied',
  'ad_user_data':'denied',
  'ad_personalization':'denied'
});
// 앞 화면에서 수락을 고른 손님이면 그 값을 되살린다
try{ if(localStorage.getItem('oye_consent')==='granted'){
  gtag('consent','update',{
    'ad_storage':'granted',
    'analytics_storage':'granted',
    'ad_user_data':'granted',
    'ad_personalization':'granted'
  });
} }catch(e){}
</script>
<!-- End 동의 기본값 -->

</head>
<body>

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">오예상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>로그인</h2>
  <form class="pay" id="auth-form" onsubmit="return false">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="6자 이상">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" type="button" id="signup-btn">가입</button>
      <button class="btn" type="button" id="login-btn">로그인</button>
      <button class="btn ghost" type="button" id="logout-btn">로그아웃</button>
    </div>
    <p id="auth-result" role="status" style="margin:20px 0 0;font-size:14px;color:var(--gold-2)"></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  // index.html 에 넣어 둔 설정과 같은 값
  const firebaseConfig = {
    apiKey: "AIzaSyDw8aUqNNNgHVkvRYGWJ75zydKqD_Rxjcc",
    authDomain: "oye-shop-77cd6.firebaseapp.com",
    projectId: "oye-shop-77cd6",
    storageBucket: "oye-shop-77cd6.firebasestorage.app",
    messagingSenderId: "218986352461",
    appId: "1:218986352461:web:aa71965c31a8094a97b104"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailBox = document.querySelector("#email");
  const passwordBox = document.querySelector("#password");
  const result = document.querySelector("#auth-result");

  // 성공하면 한 줄 안내, 실패하면 auth/ 로 시작하는 오류 코드를 그대로 보여 줍니다.
  // 이메일과 비밀번호는 dataLayer 에도, 콘솔에도 남기지 않습니다.
  async function run(action, doneText) {
    result.textContent = "";
    try {
      await action();
      result.textContent = doneText;
    } catch (err) {
      result.textContent = err.code || "알 수 없는 오류";
    }
  }

  document.querySelector("#signup-btn").addEventListener("click", () =>
    run(() => createUserWithEmailAndPassword(auth, emailBox.value.trim(), passwordBox.value), "가입했습니다. 지금 로그인된 상태입니다.")
  );

  document.querySelector("#login-btn").addEventListener("click", () =>
    run(() => signInWithEmailAndPassword(auth, emailBox.value.trim(), passwordBox.value), "로그인했습니다.")
  );

  document.querySelector("#logout-btn").addEventListener("click", () =>
    run(() => signOut(auth), "로그아웃했습니다.")
  );
</script>
</body>
</html>
