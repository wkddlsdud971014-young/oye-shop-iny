// 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
window.dataLayer = window.dataLayer || [];

// 네 신호의 기본값 — 아직 아무것도 고르지 않은 손님은 전부 denied
gtag('consent','default',{
  'ad_storage':'denied',
  'analytics_storage':'denied',
  'ad_user_data':'denied',
  'ad_personalization':'denied'
});
// 앞 화면에서 수락을 고른 손님이면 그 값을 되살린다
try{ if(localStorage.getItem('oye_consent')==='granted'){
  gtag('consent','update',{
    'ad_storage':'granted',
    'analytics_storage':'granted',
    'ad_user_data':'granted',
    'ad_personalization':'granted'
  });
} }catch(e){}
</script>
<!-- End 동의 기본값 -->

<main><div class="wrap">
  <h2>상품 사진 올리기</h2>
  <!-- 로그인했는지 확인이 끝나기 전에는 아래 내용을 숨겨 둡니다 -->
  <p class="lead" id="upload-wait">확인하고 있습니다…</p>
  <p class="lead" id="upload-login" hidden>로그인한 뒤에 쓸 수 있습니다. <a href="login.html?next=photo-upload.html">로그인하기</a></p>
  <form class="pay" id="upload-form" onsubmit="return false" hidden>
    <label for="product-pick">상품 (문서 ID)</label>
    <select id="product-pick" name="product"></select>
    <label for="photo-file">사진 파일</label>
    <input id="photo-file" name="photo" type="file" accept="image/*">
    <button class="btn" type="button" id="upload-btn">사진 올리기</button>
    <p id="upload-result" role="status" style="margin:20px 0 0;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></p>
  </form>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module">
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, collection, doc, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
  // auth.js 가 앱을 먼저 연결해 두고, 로그인 상태도 알려 준다
  import { onUser } from "./assets/auth.js";

  const db = getFirestore(getApp());
  // 버킷은 설정의 storageBucket 값을 그대로 쓴다
  const storage = getStorage(getApp());

  const wait = document.querySelector("#upload-wait");
  const loginNote = document.querySelector("#upload-login");
  const form = document.querySelector("#upload-form");
  const pick = document.querySelector("#product-pick");
  const fileBox = document.querySelector("#photo-file");
  const btn = document.querySelector("#upload-btn");
  const result = document.querySelector("#upload-result");

  // 오류 글은 줄이지 않고 그대로 보여 준다
  const errorLine = (head, err) => `${head} ${err && err.code ? err.code : ""} ${err && err.message ? err.message : String(err)}`;

  // products 문서를 전부 읽는다 — 숨긴 상품(isVisible 이 false)도 함께
  async function loadProducts() {
    pick.replaceChildren();
    try {
      const snap = await getDocs(collection(db, "products"));
      snap.docs.forEach(d => {
        const p = d.data();
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = `${d.id} — ${p.name ?? ""}${p.isVisible === false ? " (숨김)" : ""}${p.imagePath ? " · 사진 있음" : ""}`;
        pick.appendChild(opt);
      });
      if (snap.empty) result.textContent = "products 문서가 없습니다.";
    } catch (err) {
      result.textContent = errorLine("상품 목록을 읽지 못했습니다.", err);
      console.error(err);
    }
  }

  async function upload() {
    const id = pick.value;
    const file = fileBox.files[0];
    if (!id) { result.textContent = "상품을 골라 주세요."; return; }
    if (!file) { result.textContent = "사진 파일을 골라 주세요."; return; }

    // 맨 앞에 / 를 붙이지 않는다 — 예: products/p1/main.jpg
    const path = `products/${id}/main.jpg`;
    btn.disabled = true;
    result.textContent = "올리는 중 … 0%";
    try {
      // 고른 파일을 줄이거나 바꾸지 않고 그대로 올린다
      const task = uploadBytesResumable(ref(storage, path), file);
      task.on("state_changed", s => {
        const pct = s.totalBytes ? Math.floor(s.bytesTransferred / s.totalBytes * 100) : 0;
        result.textContent = `올리는 중 … ${pct}%`;
      });
      await task;
      // 다 올라간 뒤에 경로 글자만 저장한다 — 다른 필드는 그대로 둔다
      await updateDoc(doc(db, "products", id), { imagePath: path });
      result.textContent = `다 올렸습니다. ${id} 문서의 imagePath 에 ${path} 를 저장했습니다.`;
      await loadProducts();
      pick.value = id;
    } catch (err) {
      result.textContent = errorLine("사진을 올리지 못했습니다.", err);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", upload);

  onUser(user => {
    wait.hidden = true;
    loginNote.hidden = !!user;
    form.hidden = !user;
    if (user) loadProducts();
    else pick.replaceChildren();
  });
</script>
</body>
</html>
