<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 — 오예상점</title>

<link rel="stylesheet" href="assets/style.css">

<!-- 동의 기본값 — 태그 관리자보다 먼저 둡니다 -->
<script>
// 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
window.dataLayer = window.dataLayer || [];
// 동의 신호를 통로에 넣는 창구
function gtag(){dataLayer.push(arguments);}
// 네 신호의 기본값 — 아직 아무것도 고르지 않은 손님은 전부 denied
gtag('consent','default',{
  'ad_storage':'denied',
  'analytics_storage':'denied',
  'ad_user_data':'denied',
  'ad_personalization':'denied'
});
// 앞 화면에서 수락을 고른 손님이면 그 값을 되살린다
try{ if(localStorage.getItem('oye_consent')==='granted'){
  gtag('consent','update',{
    'ad_storage':'granted',
    'analytics_storage':'granted',
    'ad_user_data':'granted',
    'ad_personalization':'granted'
  });
} }catch(e){}
</script>
<!-- End 동의 기본값 -->

</head>
<body>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">오예상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>


<main><div class="wrap">
  <h2>마이페이지</h2>
  <!-- 로그인했는지 확인이 끝나기 전에는 아래 내용을 숨겨 둡니다 -->
  <p class="lead" id="mypage-wait">확인하고 있습니다…</p>
  <div id="mypage-body" hidden>
    <p class="lead">로그인한 이메일 <strong id="mypage-email" data-clarity-mask="true"></strong></p>
    <button class="btn" type="button" id="mypage-logout">로그아웃</button>
  </div>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module">
  import { onUser, logout } from "./assets/auth.js";

  onUser(user => {
    // 로그인 안 했으면 로그인 화면으로 보내고, 로그인하면 여기로 다시 오게 한다
    if (!user) {
      location.replace("login.html?next=mypage.html");
      return;
    }
    document.querySelector("#mypage-email").textContent = user.email;
    document.querySelector("#mypage-wait").hidden = true;
    document.querySelector("#mypage-body").hidden = false;
  });

  document.querySelector("#mypage-logout").addEventListener("click", logout);
</script>
</body>
</html>
