// 네 신호의 기본값 — 아직 아무것도 고르지 않은 손님은 전부 denied
gtag('consent','default',{
  'ad_storage':'denied',
  'analytics_storage':'denied',
  'ad_user_data':'denied',
  'ad_personalization':'denied'
});
// 앞 화면에서 수락을 고른 손님이면 그 값을 되살린다
try{ if(localStorage.getItem('oye_consent')==='granted'){
  gtag('consent','update',{
    'ad_storage':'granted',
    'analytics_storage':'granted',
    'ad_user_data':'granted',
    'ad_personalization':'granted'
  });
} }catch(e){}
</script>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">오예상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main><div class="wrap">
  <h2>규칙 확인</h2>
  <!-- 로그인했는지 확인이 끝나기 전에는 아래 내용을 숨겨 둡니다 -->
  <p class="lead" id="check-wait">확인하고 있습니다…</p>
  <p class="lead" id="check-login" hidden>로그인한 뒤에 쓸 수 있습니다. 먼저 로그인해 주세요.</p>
  <div id="check-body" hidden>
    <p class="lead">로그인한 이메일 <strong id="check-email" data-clarity-mask="true"></strong></p>
    <p class="lead">UID <strong id="check-uid" data-clarity-mask="true" style="word-break:break-all"></strong></p>

    <h3>주문 전체 읽기</h3>
    <button class="btn" type="button" id="btn-read-all">주문 전체 읽기</button>
    <div id="result-read-all" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

    <h3>내 주문 금액 고치기</h3>
    <button class="btn" type="button" id="btn-my-price">내 주문 금액 고치기</button>
    <div id="result-my-price" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

    <h3>상품 가격 0원으로</h3>
    <button class="btn" type="button" id="btn-product-zero">상품 가격 0원으로</button>
    <div id="result-product-zero" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

    <h3>서버에게 금액 묻기</h3>
    <button class="btn" type="button" id="btn-ask-total">서버에게 금액 묻기</button>
    <div id="result-ask-total" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

    <h3>가격 바꿔 보내기</h3>
    <button class="btn" type="button" id="btn-fake-price">가격 바꿔 보내기</button>
    <div id="result-fake-price" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

    <h3>수량 0으로 묻기</h3>
    <button class="btn" type="button" id="btn-zero-qty">수량 0으로 묻기</button>
    <div id="result-zero-qty" role="status" style="margin:12px 0 32px;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>
  </div>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/shop.js"></script>
<script src="assets/app.js"></script>
<script src="assets/consent.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module">
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore, collection, query, where, limit, getDocs, doc, updateDoc
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
  // auth.js 가 앱을 먼저 연결해 두고, 로그인 상태도 알려 준다
  import { auth, onUser } from "./assets/auth.js";

  const db = getFirestore(getApp());
  // 서버 함수 calcOrderTotal - us-central1 에 있다
  const calcOrderTotal = httpsCallable(getFunctions(getApp(), "us-central1"), "calcOrderTotal");

  const wait = document.querySelector("#check-wait");
  const loginNote = document.querySelector("#check-login");
  const body = document.querySelector("#check-body");

  // 오류 글은 줄이지 않고 그대로 보여 준다
  const errorLine = (head, err) => `${head}\n${err && err.code ? err.code : ""}\n${err && err.message ? err.message : String(err)}`;

  // 단추 하나를 눌렀을 때 — 실패해도 이 단추의 결과 칸에만 쓰고, 다른 단추는 그대로 둔다
  function wire(btnId, boxId, run) {
    const btn = document.querySelector(btnId);
    const box = document.querySelector(boxId);
    btn.addEventListener("click", async () => {
      const uid = auth.currentUser?.uid;
      if (!uid) { box.textContent = "로그인한 뒤에 쓸 수 있습니다."; return; }
      btn.disabled = true;
      box.textContent = "확인하는 중…";
      try {
        await run(uid, box);
      } catch (err) {
        console.error(err);
        box.textContent = errorLine("실패했습니다.", err);
      } finally {
        btn.disabled = false;
      }
    });
  }

  /* --- 1. 주문 전체 읽기 — 조건 없이 orders 를 한 번 읽는다 --- */
  wire("#btn-read-all", "#result-read-all", async (uid, box) => {
    const snap = await getDocs(collection(db, "orders"));
    const others = snap.docs.filter(d => d.get("userId") !== uid).length;

    const summary = document.createElement("p");
    summary.style.margin = "0 0 12px";
    summary.textContent = `성공했습니다. 전체 주문 ${snap.size}건 · 내 UID 가 아닌 주문 ${others}건`;

    const table = document.createElement("table");
    table.className = "cart";
    table.innerHTML = "<thead><tr><th>문서 ID</th><th>userId</th><th>totalPrice</th></tr></thead>";
    const tbody = document.createElement("tbody");
    snap.docs.forEach(d => {
      const tr = document.createElement("tr");
      [d.id, String(d.get("userId") ?? ""), String(d.get("totalPrice") ?? "")].forEach(text => {
        const td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.replaceChildren(summary, table);
  });

  /* --- 2. 내 주문 금액 고치기 — 내 주문 하나의 totalPrice 만 1 로 --- */
  wire("#btn-my-price", "#result-my-price", async (uid, box) => {
    const snap = await getDocs(query(collection(db, "orders"), where("userId", "==", uid), limit(1)));
    if (snap.empty) { box.textContent = "내 UID 로 된 주문이 없습니다. 바꾼 문서가 없습니다."; return; }
    const id = snap.docs[0].id;
    await updateDoc(doc(db, "orders", id), { totalPrice: 1 });
    box.textContent = `성공했습니다. orders/${id} 의 totalPrice 를 1 로 바꿨습니다.`;
  });

  /* --- 3. 상품 가격 0원으로 — products/p1 의 price 만 0 으로 --- */
  wire("#btn-product-zero", "#result-product-zero", async (uid, box) => {
    await updateDoc(doc(db, "products", "p1"), { price: 0 });
    box.textContent = "성공했습니다. products/p1 의 price 를 0 으로 바꿨습니다.";
  });

  /* --- 4. 서버에게 금액 묻기 — p1 을 2개 사면 얼마인지 서버가 계산한다 --- */
  wire("#btn-ask-total", "#result-ask-total", async (uid, box) => {
    const result = await calcOrderTotal({ productId: "p1", quantity: 2 });
    box.textContent = `성공했습니다. totalPrice ${result.data.totalPrice}`;
  });

  /* --- 5. 가격 바꿔 보내기 — price 100 을 같이 보내도 서버는 쓰지 않는다 --- */
  wire("#btn-fake-price", "#result-fake-price", async (uid, box) => {
    const result = await calcOrderTotal({ productId: "p1", quantity: 2, price: 100 });
    box.textContent = `성공했습니다. 보낸 price 100 · 서버가 돌려준 totalPrice ${result.data.totalPrice}`;
  });

  /* --- 6. 수량 0으로 묻기 — quantity 0 을 보내면 서버가 거절하는지 본다 --- */
  wire("#btn-zero-qty", "#result-zero-qty", async (uid, box) => {
    const result = await calcOrderTotal({ productId: "p1", quantity: 0 });
    box.textContent = `성공했습니다. totalPrice ${result.data.totalPrice}`;
  });

  onUser(user => {
    wait.hidden = true;
    loginNote.hidden = !!user;
    body.hidden = !user;
    document.querySelector("#check-email").textContent = user ? (user.email ?? "") : "";
    document.querySelector("#check-uid").textContent = user ? user.uid : "";
  });
</script>
</body>
</html>
