<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리 화면 — 오예상점</title>
<meta name="description" content="가게 주인과 직원이 쓰는 관리 화면 입구입니다">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css">

<!-- 동의 기본값 — 태그 관리자보다 먼저 둡니다 -->
<script>
// 통로가 이미 있으면 그대로 쓰고, 없을 때만 새로 만든다
window.dataLayer = window.dataLayer || [];
// 동의 신호를 통로에 넣는 창구
function gtag(){dataLayer.push(arguments);}
// 네 신호의 기본값 — 아직 아무것도 고르지 않은 손님은 전부 denied
gtag('consent','default',{
  'ad_storage':'denied',
  'analytics_storage':'denied',
  'ad_user_data':'denied',
  'ad_personalization':'denied'
});
// 앞 화면에서 수락을 고른 손님이면 그 값을 되살린다
try{ if(localStorage.getItem('oye_consent')==='granted'){
  gtag('consent','update',{
    'ad_storage':'granted',
    'analytics_storage':'granted',
    'ad_user_data':'granted',
    'ad_personalization':'granted'
  });
} }catch(e){}
</script>
<!-- End 동의 기본값 -->

</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WDM6H3L4"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- 가게 메뉴는 두지 않는다 - 주소를 직접 넣어서 여는 화면 -->
<header class="site"><div class="wrap">
  <span class="brand">오예상점 관리</span>
</div></header>

<main><div class="wrap">
  <h2>관리 화면</h2>
  <!-- 로그인했는지 확인이 끝나기 전에는 아래 내용을 숨겨 둡니다 -->
  <p class="lead" id="gate-wait">확인하고 있습니다…</p>
  <p class="lead" id="gate-login" hidden>로그인이 필요합니다 <a href="/login.html">로그인하러 가기</a></p>
  <p class="lead" id="gate-admin" hidden></p>
  <div id="gate-info" hidden>
    <p class="lead">로그인 : <span id="info-email" data-clarity-mask="true"></span></p>
    <p class="lead">토큰을 받은 시각 : <span id="info-issued"></span></p>
  </div>
  <div id="gate-denied" hidden>
    <p class="lead">권한이 없습니다</p>
    <button class="btn" type="button" id="btn-grant">주인 명찰 받기</button>
  </div>
  <div id="gate-result" role="status" style="margin:12px 0 0;font-size:14px;color:var(--gold-2);white-space:pre-wrap;word-break:break-all"></div>

  <div id="gate-recheck" hidden style="margin-top:32px">
    <button class="btn ghost" type="button" id="btn-recheck">다시 확인</button>
  </div>
</div></main>
<footer class="site"><div class="wrap"></div></footer>
<script src="assets/consent.js"></script>
<script type="module" src="assets/auth.js"></script>
<script type="module">
  import { getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
  // auth.js 가 앱을 먼저 연결해 두고, 로그인 상태도 알려 준다
  import { auth, onUser } from "./assets/auth.js";

  // 서버 함수 grantOwnerRole - us-central1 에 있다
  const grantOwnerRole = httpsCallable(getFunctions(getApp(), "us-central1"), "grantOwnerRole");

  const wait = document.querySelector("#gate-wait");
  const loginNote = document.querySelector("#gate-login");
  const adminNote = document.querySelector("#gate-admin");
  const info = document.querySelector("#gate-info");
  const denied = document.querySelector("#gate-denied");
  const recheck = document.querySelector("#gate-recheck");
  const result = document.querySelector("#gate-result");
  const grantBtn = document.querySelector("#btn-grant");
  const recheckBtn = document.querySelector("#btn-recheck");

  // 오류 글은 줄이지 않고 그대로 보여 준다
  const errorLine = (head, err) => `${head}\n${err && err.code ? err.code : ""}\n${err && err.message ? err.message : String(err)}`;

  // 판단은 로그인 토큰의 커스텀 클레임 role 로만 한다 - Firestore users 문서는 보지 않는다
  // fresh 가 true 면 토큰을 서버에서 새로 받아 온다
  async function judge(fresh) {
    const user = auth.currentUser;
    wait.hidden = true;
    loginNote.hidden = !!user;
    recheck.hidden = !user;
    adminNote.hidden = true;
    info.hidden = true;
    denied.hidden = true;
    if (!user) { result.textContent = ""; return; }

    const token = await user.getIdTokenResult(fresh);
    const role = token.claims.role;
    if (role === "staff" || role === "admin") {
      adminNote.textContent = `관리자: ${role}`;
      adminNote.hidden = false;
      // 지금 로그인한 이메일과, 이 토큰을 받은 시각(한국 시간)
      document.querySelector("#info-email").textContent = user.email ?? "";
      document.querySelector("#info-issued").textContent =
        new Date(token.issuedAtTime).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
      info.hidden = false;
    } else {
      denied.hidden = false;
    }
  }

  // 「주인 명찰 받기」 - 함수가 성공하면 토큰을 새로 받아 다시 판단한다
  grantBtn.addEventListener("click", async () => {
    grantBtn.disabled = true;
    result.textContent = "명찰을 받는 중…";
    try {
      await grantOwnerRole();
      result.textContent = "";
      await judge(true);
    } catch (err) {
      console.error(err);
      result.textContent = errorLine("명찰을 받지 못했습니다.", err);
    } finally {
      grantBtn.disabled = false;
    }
  });

  // 「다시 확인」 - 토큰을 새로 받아 다시 판단한다
  recheckBtn.addEventListener("click", async () => {
    recheckBtn.disabled = true;
    result.textContent = "";
    try {
      await judge(true);
    } catch (err) {
      console.error(err);
      result.textContent = errorLine("다시 확인하지 못했습니다.", err);
    } finally {
      recheckBtn.disabled = false;
    }
  });

  onUser(() => {
    judge(false).catch(err => {
      console.error(err);
      result.textContent = errorLine("확인하지 못했습니다.", err);
    });
  });
</script>
</body>
</html>
